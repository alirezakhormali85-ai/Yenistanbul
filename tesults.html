<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sınav Sonuçları</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #2c2c2c;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 800px;
            margin-top: 20px;
        }
        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 30px;
        }
        .result-section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #444;
        }
        .result-section:last-child {
            border-bottom: none;
        }
        .result-section h2 {
            color: #007bff; /* Highlight section titles */
            margin-bottom: 20px;
        }
        .result-item {
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .result-item strong {
            color: #cccccc;
            display: inline-block;
            width: 120px; /* Fixed width for question labels */
        }
        .result-item span {
            color: #e0e0e0;
        }
        .no-results {
            text-align: center;
            color: #ff6666;
            font-weight: bold;
        }
        .btn-back {
            display: block;
            width: fit-content;
            margin: 30px auto 0 auto;
            padding: 12px 25px;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-back:hover {
            background-color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sınav Sonuçları</h1>
        <div id="resultsContent">
            <!-- Sonuçlar buraya eklenecek -->
        </div>
        <button class="btn-back" onclick="window.location.href='index.html'">Geri Dön</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const studentName = localStorage.getItem('examStudentName');
            const answersJSON = localStorage.getItem('examAnswers');
            const resultsContentDiv = document.getElementById('resultsContent');

            if (!studentName || !answersJSON) {
                resultsContentDiv.innerHTML = '<p class="no-results">Sonuçlar bulunamadı. Lütfen önce sınavı tamamlayın.</p>';
                return;
            }

            const answers = JSON.parse(answersJSON);
            let resultsHtml = `
                <div class="result-section">
                    <h2>Öğrenci Bilgileri</h2>
                    <div class="result-item">
                        <strong>Ad Soyad:</strong> <span>${studentName}</span>
                    </div>
                </div>
                <div class="result-section">
                    <h2>Cevaplar</h2>
            `;

            for (let i = 1; i <= 30; i++) {
                const answer = answers[`q${i}`] || 'Boş bırakıldı';
                resultsHtml += `
                    <div class="result-item">
                        <strong>Soru ${i}:</strong> <span>${answer}</span>
                    </div>
                `;
            }

            resultsHtml += '</div>'; // Close results-section for answers
            resultsContentDiv.innerHTML = resultsHtml;

            // Clear stored data after displaying (optional, depending on desired behavior)
            // localStorage.removeItem('examStudentName');
            // localStorage.removeItem('examAnswers');
        });
    </script>
</body>
</html>
